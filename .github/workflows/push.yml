on: [push, pull_request]

name: CI
jobs:
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    name: Test suite

    steps:
      - uses: actions/checkout@v6
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -v ./...
