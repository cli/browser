on: [push, pull_request]

name: CI
jobs:
  test:
    strategy:
      matrix:
        go:
          - '1.13'
          - '1.14'
          - '1.15'
          - '1.16'
          - '1.17'
          - '1.18'
          - '1.19'
          - '1.20'
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false
    
    runs-on: ${{ matrix.os }}
    name: Test suite

    steps:
      - uses: actions/checkout@v2
      - name: Setup go
        uses: actions/setup-go@v1
        with:
          go-version: ${{ matrix.go }}
      - run: go test -v ./...
